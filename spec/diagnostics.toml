# Diagnostic code registry: the machine-readable source for spec/11-diagnostics.md
# and `rootplc explain`. Codes are permanent: never reuse or renumber one.
# A retired code stays here with `retired = true`.
# stage: the compiler phase that reports it (lex, parse, sema). The conformance
# runner uses it to decide which expectations each implemented phase must meet.
#
# Ranges: RP0001-0099 lexical, RP0100-0199 types, RP0200-0299 declarations and POUs,
#         RP0300-0399 statements and expressions, RP0400-0499 tasks/config,
#         RP0500-0599 tests, RP0600-0699 properties, RP0700-0799 graphical text,
#         RP0800-0899 project manifest.

