# Qwen Code, one-shot (positional prompt). Command lines written for Qwen Code
# 0.26.6; set `verified` once a run succeeds. Login: run `qwen` once and sign in.
name = "qwen-code"
ecosystem = "chinese"
verified = "no"
model = ""

command_with = ["qwen", "{prompt}", "--approval-mode", "yolo", "--output-format", "stream-json",
  "--allowed-mcp-server-names", "rootplc"]
command_without = ["qwen", "{prompt}", "--approval-mode", "yolo", "--output-format", "stream-json",
  "--allowed-mcp-server-names", "none"]

[with_files]
".qwen/settings.json" = '{"mcpServers":{"rootplc":{"command":"rootplc","args":["mcp"]}},"context":{"fileName":["AGENTS.md"]}}'
