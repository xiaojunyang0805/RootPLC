[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/xiaojunyang0805/RootPLC"
homepage = "https://rootplc.org"
authors = ["RootPLC contributors"]

# Internal crates. External dependencies must come from the audited
# allow-list (see deny.toml) and be added here, never per crate.
[workspace.dependencies]
rootplc-abi         = { path = "crates/rootplc-abi", version = "0.0.0" }
rootplc-diag        = { path = "crates/rootplc-diag", version = "0.0.0" }
rootplc-syntax      = { path = "crates/rootplc-syntax", version = "0.0.0" }
rootplc-sema        = { path = "crates/rootplc-sema", version = "0.0.0" }
rootplc-stdlib      = { path = "crates/rootplc-stdlib", version = "0.0.0" }
rootplc-vm          = { path = "crates/rootplc-vm", version = "0.0.0" }
rootplc-codegen-c   = { path = "crates/rootplc-codegen-c", version = "0.0.0" }
rootplc-testing     = { path = "crates/rootplc-testing", version = "0.0.0" }
rootplc-verify      = { path = "crates/rootplc-verify", version = "0.0.0" }
rootplc-interchange = { path = "crates/rootplc-interchange", version = "0.0.0" }
rootplc-graph       = { path = "crates/rootplc-graph", version = "0.0.0" }
rootplc-sim         = { path = "crates/rootplc-sim", version = "0.0.0" }
rootplc-driver      = { path = "crates/rootplc-driver", version = "0.0.0" }
rootplc-mcp         = { path = "crates/rootplc-mcp", version = "0.0.0" }
rootplc-fieldbus    = { path = "crates/rootplc-fieldbus", version = "0.0.0" }
rootplc-runtime     = { path = "crates/rootplc-runtime", version = "0.0.0" }

[workspace.lints.rust]
# `unsafe` is allowed only in modules marked `#[allow(unsafe_code)]`
# inside FFI / hardware crates (runtime, fieldbus). Never `forbid` here,
# so those marked modules can opt in.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
