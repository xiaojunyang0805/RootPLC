# Real-world PLC code corpus. The repository stores only this manifest and
# the tools; code is cloned into corpus/.cache (git-ignored) and analysed
# there. `redistribute = true` only for permissive licences (MIT, BSD,
# Apache, CC0, Unlicense): only those may ever be copied into a published
# dataset. Everything else is analysed locally and cited by URL.
#
# format: "st" (plain files), "twincat" (.TcPOU/.TcDUT/.TcGVL XML),
#         "brx" (B&R: declarations in .fun/.typ/.var, bodies in .st),
#         "binary" / "none": nothing to extract (see note)

[[project]]
name = "tcunit"
url = "https://github.com/tcunit/TcUnit"
licence = "MIT (custom text)"
redistribute = false
format = "twincat"
kind = "test framework"

