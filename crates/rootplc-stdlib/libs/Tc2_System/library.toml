# Compatibility library: the interface of Beckhoff's Tc2_System, for TwinCAT
# code. Clean-room: written only from the public references below. RootPLC is
# an independent project, not affiliated with or endorsed by Beckhoff
# Automation; the vendor field names whose interface this mirrors.
name = "Tc2_System"
vendor = "Beckhoff Automation GmbH"
version = "1.0.0"
description = "TwinCAT Tc2_System: T_MaxString, system constants, ADS logging (messages recorded in the run report), ST_LibVersion, AMS address types, task index, CPU counter, F_CreateAmsNetId, the ADS error enumerations E_AdsErr and E_HRESULTAdsErr (device and client codes); declared only: MEMCPY/MEMMOVE/MEMSET/MEMCMP, DRAND, file blocks, ADSREAD/ADSWRITE, F_GetSystemTime"
requires = ["TwinCAT_BuiltIns"]
intrinsics = ["__ROOTPLC_LOG"]
declare_only = ["GETCPUCOUNTER", "MEMCPY", "MEMMOVE", "MEMSET", "MEMCMP", "DRAND", "FB_FileOpen", "FB_FileClose", "FB_FileWrite", "FB_FileRead", "FB_FilePuts", "FB_FileGets", "FB_FileDelete", "FB_CreateDir", "ADSREAD", "ADSWRITE", "F_GetSystemTime"]
references = [
