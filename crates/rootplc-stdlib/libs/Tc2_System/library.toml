  "https://infosys.beckhoff.com/content/1033/tcplclib_tc2_system/31030539.html (ADSLOGDINT)",
  "https://infosys.beckhoff.com/content/1033/tcplclib_tc2_system/31032075.html (ADSLOGLREAL)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/714823819.html (ST_LibVersion)",
