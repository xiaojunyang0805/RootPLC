  "https://infosys.beckhoff.com/content/1033/tf7xxx_tc3_vision/2334733579.html (HRESULT member names INVALIDPARM, NOTFOUND, ... for the device codes)",
  "https://infosys.beckhoff.com/content/1033/tcplclib_tc2_system/31084171.html (global constants)",
  "https://infosys.beckhoff.com/content/1033/tcplclib_tc2_system/31062795.html (T_MaxString)",
