# RootPLC's own motion library (spec/13-motion.md): single-axis motion on a
# virtual axis, so motion code can be tested before a machine moves. The
# function-block names follow the industry-standard PLCopen motion names;
# behaviour and code are RootPLC's own, written clean-room from the public
# overview below. Not affiliated with or endorsed by PLCopen.
name = "RootMotion"
vendor = "RootPLC"
version = "0.1.0"
description = "RootMotion: AXIS_REF (with machine limits), RP_VirtualAxis (trapezoid profile, software limits), MC_Power, MC_Home, MC_MoveAbsolute, MC_MoveRelative, MC_MoveVelocity, MC_Stop, MC_Halt, MC_Reset, MC_ReadActualPosition, MC_ReadStatus"
requires = []
declare_only = []
intrinsics = ["__ROOTPLC_AXIS_CYCLE"]
references = [
  "https://www.plcopen.org/sites/default/files/downloads/plcopen_motion_control_overview.pdf (function-block names and the single-axis state model, public overview)",
]
