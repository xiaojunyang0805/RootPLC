# Compatibility library: names that every TwinCAT project has without a
# library reference (built into the TwinCAT environment). RootPLC's own
# library; activate it for TwinCAT code (the corpus tool does so for every
# TwinCAT project). Clean-room: written from the public references below.
name = "TwinCAT_BuiltIns"
vendor = "RootPLC"
version = "1.0.0"
description = "TwinCAT built-in names: the BIT type, the __SYSTEM.IQueryInterface base interface, SIZEOF / XSIZEOF"
declare_only = []
# operators this library enables, with TwinCAT's 64-bit memory layout
intrinsics = ["SIZEOF", "XSIZEOF"]
references = [
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/2529343371.html (bit access, BIT members in structures)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/2528896907.html (SIZEOF: result type by size)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/13614027275.html (XSIZEOF)",
  "https://infosys.beckhoff.com/content/1033/tc3_grundlagen/3539073675.html (alignment of data types: 8-byte default)",
]
