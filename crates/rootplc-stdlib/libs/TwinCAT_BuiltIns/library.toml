# Compatibility library: names that every TwinCAT project has without a
# library reference (built into the TwinCAT environment). RootPLC's own
# library; activate it for TwinCAT code (the corpus tool does so for every
# TwinCAT project). Clean-room: written from the public references below.
name = "TwinCAT_BuiltIns"
vendor = "RootPLC"
version = "1.0.0"
description = "TwinCAT built-in names: the BIT type, the __SYSTEM.IQueryInterface base interface, SIZEOF / XSIZEOF, XINT/UXINT/XWORD, PVOID (untyped reference), HRESULT, TwinCAT_SystemInfoVarList (_TaskInfo, _AppInfo), __SYSTEM.TYPE_CLASS"
declare_only = []
# operators this library enables, with TwinCAT's 64-bit memory layout
intrinsics = ["SIZEOF", "XSIZEOF", "PVOID", "__POUNAME", "TIME", "__NEW", "__DELETE", "ANY", "__QUERYINTERFACE", "__QUERYPOINTER"]
references = [
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/2529343371.html (bit access, BIT members in structures)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/2528896907.html (SIZEOF: result type by size)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/13614027275.html (XSIZEOF)",
  "https://infosys.beckhoff.com/content/1033/tc3_grundlagen/3539073675.html (alignment of data types: 8-byte default)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/2529448075.html (XINT, UXINT, XWORD, PVOID: 64-bit LINT, ULINT, LWORD)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/714821259.html (PlcTaskSystemInfo, _TaskInfo)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/714818699.html (PlcAppSystemInfo, _AppInfo)",
  "https://content.helpme-codesys.com/en/LibDevSummary/type_class.html (__SYSTEM.TYPE_CLASS: member names and values)",
  "https://infosys.beckhoff.com/content/1033/tc3_plc_intro/12049349259.html (error codes: hrErrorCode of type HRESULT, negative = error)",
  "https://content.helpme-codesys.com/en/CODESYS%20Development%20System/_cds_datatype_any.html (ANY inputs: __SYSTEM.AnyType with type class, pvalue, diSize)",
]
